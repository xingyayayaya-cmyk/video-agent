# =============================================================================
# 前端容器 Nginx 站点配置
#   1) 托管 Vue 打包产物，支持 history 路由回退
#   2) 把 /api 反向代理到后端容器（服务名 backend）
# 说明：前端代码里 axios 的 baseURL 是相对路径 "/api/v1"，
#       因此同源部署下无需任何 CORS 配置，请求直接由 Nginx 转发。
# =============================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 视频上传：单文件上限放宽到 1G（与后端 video_max_duration 配合使用）
    client_max_body_size 1024m;

    # 大文件上传/长耗时审核：关闭请求体缓冲、放宽超时
    client_body_timeout  600s;
    send_timeout         600s;

    # 静态资源 + SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 编译产物带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 视频上传边收边转，不落盘缓冲
        proxy_request_buffering off;

        # AI 三轨审核是长任务（正片可能跑几分钟），读超时放宽到 10 分钟
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 30s;
    }
}
